[project]
name = "flamesays-p10-hub12-screen"
version = "0.1.0"
description = "Standalone MicroPython package for the verified FlameSays P10 HUB12 panel"
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p10_hub12_screen"]

[tool.hatch.build]
packages = ["src/p10_hub12_screen"]